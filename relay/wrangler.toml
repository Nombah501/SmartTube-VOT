# Deploy:
#   cd relay
#   npx wrangler login          # once, opens browser
#   npx wrangler kv namespace create AUTH
#   -> put the returned id into kv_namespaces below
#   npx wrangler deploy
# Optional (enables the one-tap Yandex button on the phone page):
#   register an app at https://oauth.yandex.ru/ (web service, redirect URI
#   https://<this-worker>.workers.dev/cb), then set OAUTH_CLIENT_ID below.
name = "smarttube-vot-auth"
main = "worker.js"
workers_dev = true
compatibility_date = "2026-08-01"
preview_urls = true

routes = [
  { pattern = "v.n501.site", custom_domain = true }
]

[vars]
OAUTH_CLIENT_ID = "43ad0b19d0d549b6bd1c8b362b05e01b"

[[kv_namespaces]]
binding = "AUTH"
id = "884f1a5a4f9b46b8b1cf29930a3f2165"
